server {
    listen 80;
    server_name _;

    # Angular frontend
    location / {
        proxy_pass http://crud-frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Backend API
    # /api/... on browser -> /api/... on backend:3000
    location /api/ {
        proxy_pass http://crud-backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
