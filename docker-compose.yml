version: "3.9"

services:
  mongo:
    image: mongo:6
    container_name: crud-mongo
    restart: always
    ports:
      - "27017:27017"
    networks:
      - crud-network

  backend:
    image: guru615/crud-dd-backend:latest
    container_name: crud-backend
    restart: always
    environment:
      PORT: 3000
      # use simple connection string; backend must use this env (MONGO_URI)
      MONGO_URI: mongodb://mongo:27017/crud-db
    depends_on:
      - mongo
    networks:
      - crud-network

  frontend:
    image: guru615/crud-dd-frontend:latest
    container_name: crud-frontend
    restart: always
    depends_on:
      - backend
    networks:
      - crud-network

  nginx:
    image: nginx:alpine
    container_name: crud-nginx
    restart: always
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - crud-network

networks:
  crud-network:
    driver: bridge
