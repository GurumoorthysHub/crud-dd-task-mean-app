  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/dd-key.pem
          chmod 600 ~/.ssh/dd-key.pem

      - name: Add EC2 to known hosts
        run: ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy on EC2
        run: |
          ssh -i ~/.ssh/dd-key.pem ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
          set -e

          # Go to project folder (change your real path if different)
          cd /opt/mean-app/crud-dd-task-mean-app

          # Force overwrite any manual server changes
          git fetch origin main
          git reset --hard origin/main

          # Redeploy containers with latest images
          docker compose pull
          docker compose down
          docker compose up -d --remove-orphans

          # Show running containers
          docker ps
          EOF
